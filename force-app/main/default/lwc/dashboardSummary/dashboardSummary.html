<template>

    <lightning-card title="Executive Summary" icon-name="utility:summary">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-wrap slds-gutters">

                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <p class="label">Dashboard Title</p>
                    <p class="value">{dashboard.dashboardTitle}</p>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                    <p class="label">Generated By</p>
                    <p class="value">{dashboard.generatedBy}</p>
                </div>

                <div class="slds-col slds-size_1-of-1">
                    <p class="label">Dashboard Description</p>
                    <p class="value">{dashboard.dashboardDescription}</p>
                </div>

                <div class="slds-col slds-size_1-of-1">
                    <p class="label">Executive Summary</p>
                    <p class="value">{dashboard.executiveSummary}</p>
                </div>

                <div class="slds-col slds-size_1-of-1">
                    <p class="label">AI Recommendation</p>
                    <p class="value recommendation">
                        {dashboard.aiRecommendation}
                    </p>
                </div>

            </div>

            <div class="score-section slds-m-top_large">

                <div class="score-box">

                    <div class="score">

                        {dashboard.overallScore}

                    </div>

                    <div class="score-label">

                        Overall Score

                    </div>

                </div>

                <div class="risk-box">

                    <lightning-badge
                        label={dashboard.overallRisk}>
                    </lightning-badge>

                </div>

            </div>

        </div>

    </lightning-card>

</template>
